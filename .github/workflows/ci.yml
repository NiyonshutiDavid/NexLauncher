name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["site/**", "docs/**", "*.md"]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - run: swift --version
      - run: swift test

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: GTK 4 and libadwaita
        run: apt-get update && apt-get install -y --no-install-recommends libadwaita-1-dev libgtk-4-dev libvte-2.91-gtk4-dev pkg-config git
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test
